<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>위젯 서랍</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600&family=IBM+Plex+Mono:wght@500&family=Nunito:wght@600;700;800&display=swap">
<style>
/* Layout: 유리판 위젯 카드가 흐린 색 번짐 위에 격자로 놓인 서랍. 분류 탭으로 걸러 보고, 카드마다 「단독 보기」(#w-이름)로 하나만 띄운다 */
:root{
  --bg:#EEF1F8; --blob1:#BFD3FF; --blob2:#FFD9C7; --blob3:#CFF1E6;
  --glass:rgba(255,255,255,.64); --glass-2:rgba(255,255,255,.45); --glass-line:rgba(255,255,255,.92); --hair:rgba(40,52,90,.11);
  --fg:#1E2638; --muted:#5D6880; --faint:#8C95AA;
  --accent:#3F63D6; --accent-soft:rgba(63,99,214,.12); --warm:#E07A3F; --warm-soft:rgba(224,122,63,.14);
  --ok:#2F9E6A; --bad:#D2465A; --sun:#D2465A; --sat:#3F63D6;
  --c1:#4C7DF0; --c2:#EE8A4C; --c3:#2AA897; --c4:#DD5579; --c5:#8B6CE0; --c6:#CFA21C; --c7:#A57A52; --c8:#7D889D;
  --shadow:0 10px 30px rgba(40,52,90,.08);
  --f-body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --f-num:"IBM Plex Mono",ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#12161F; --blob1:#22366E; --blob2:#5A3326; --blob3:#1C4A40;
  --glass:rgba(30,37,52,.66); --glass-2:rgba(30,37,52,.45); --glass-line:rgba(255,255,255,.08); --hair:rgba(220,228,255,.11);
  --fg:#E8ECF5; --muted:#A3ACC0; --faint:#77809A;
  --accent:#8FA8FF; --accent-soft:rgba(143,168,255,.16); --warm:#F2A06E; --warm-soft:rgba(242,160,110,.16);
  --ok:#4CC08A; --bad:#F06A7C; --sun:#F06A7C; --sat:#8FA8FF;
  --c1:#7B9CFF; --c2:#F2A06E; --c3:#4CC8B6; --c4:#F07A9A; --c5:#A68CF2; --c6:#E2BE45; --c7:#C49A70; --c8:#9AA4B8;
  --shadow:0 10px 30px rgba(0,0,0,.3); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#12161F; --blob1:#22366E; --blob2:#5A3326; --blob3:#1C4A40;
  --glass:rgba(30,37,52,.66); --glass-2:rgba(30,37,52,.45); --glass-line:rgba(255,255,255,.08); --hair:rgba(220,228,255,.11);
  --fg:#E8ECF5; --muted:#A3ACC0; --faint:#77809A;
  --accent:#8FA8FF; --accent-soft:rgba(143,168,255,.16); --warm:#F2A06E; --warm-soft:rgba(242,160,110,.16);
  --ok:#4CC08A; --bad:#F06A7C; --sun:#F06A7C; --sat:#8FA8FF;
  --c1:#7B9CFF; --c2:#F2A06E; --c3:#4CC8B6; --c4:#F07A9A; --c5:#A68CF2; --c6:#E2BE45; --c7:#C49A70; --c8:#9AA4B8;
  --shadow:0 10px 30px rgba(0,0,0,.3); color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
html{color-scheme:light}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:14px;line-height:1.5;overflow-x:hidden}
.bg{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.bg i{position:absolute;border-radius:50%;filter:blur(70px);opacity:.7;animation:drift 24s ease-in-out infinite alternate}
.bg i:nth-child(1){width:46vw;height:46vw;left:-10vw;top:-12vw;background:var(--blob1)}
.bg i:nth-child(2){width:38vw;height:38vw;right:-8vw;top:24vh;background:var(--blob2);animation-delay:-8s}
.bg i:nth-child(3){width:42vw;height:42vw;left:25vw;bottom:-18vw;background:var(--blob3);animation-delay:-16s}
@keyframes drift{to{transform:translate(4vw,3vw) scale(1.08)}}

.wrap{position:relative;z-index:1;max-width:1240px;margin:0 auto;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:24px 56px;display:grid;gap:16px}
header{display:flex;flex-wrap:wrap;gap:10px 20px;align-items:flex-end;justify-content:space-between}
h1{font-size:clamp(22px,3.6vw,28px);font-weight:600;letter-spacing:-.02em;margin:0}
.eyebrow{font-size:12px;letter-spacing:.06em;color:var(--muted);font-weight:500}
.sub{color:var(--muted);font-size:12px}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tab{font:inherit;font-size:13px;padding:6px 14px;border-radius:999px;border:1px solid var(--hair);background:var(--glass-2);color:var(--muted);cursor:pointer}
.tab[aria-pressed="true"]{color:var(--accent);border-color:var(--accent);background:var(--accent-soft);font-weight:500}
.save-state{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px}
.save-state i{width:7px;height:7px;border-radius:50%;background:var(--faint)}
.save-state.cloud i{background:var(--ok)}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px;align-items:start}
.card{background:var(--glass);border:1px solid var(--glass-line);border-radius:18px;box-shadow:var(--shadow);
  backdrop-filter:blur(18px) saturate(1.3);-webkit-backdrop-filter:blur(18px) saturate(1.3);padding:14px 16px 16px;min-width:0;display:grid;gap:10px}
.card.wide{grid-column:span 2}
.card-h{display:flex;justify-content:space-between;align-items:center;gap:8px}
.card-h h2{font-size:14px;font-weight:600;margin:0}
.card-h .cat{font-size:11px;color:var(--faint);margin-left:6px;font-weight:400}
.solo-link{font-size:11px;color:var(--faint);text-decoration:none;border:1px solid transparent;border-radius:6px;padding:1px 6px}
.solo-link:hover{color:var(--accent);border-color:var(--hair)}
body.solo header,body.solo .tabs-row,body.solo footer{display:none}
body.solo .wrap{padding-block:8px 12px}
body.solo .mm-wrap svg{max-height:420px}
body.solo .grid{grid-template-columns:1fr;max-width:none;margin:0;width:100%}
body.solo .card.wide{grid-column:auto}
.back{display:none;font-size:12px;color:var(--accent);text-decoration:none}
body.solo .back{display:none}

/* controls */
button,input,select,textarea{font:inherit;color:inherit}
.btn{font-size:12px;padding:5px 10px;border-radius:8px;border:1px solid var(--hair);background:var(--glass-2);cursor:pointer;color:var(--fg);white-space:nowrap}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn.pri{border-color:var(--accent);color:var(--accent);background:var(--accent-soft);font-weight:500}
.btn.ghost{background:transparent;border-color:transparent;color:var(--faint);padding:2px 6px}
.btn.ghost:hover{color:var(--bad);border-color:transparent}
.in,textarea.in,select.in{width:100%;min-width:0;padding:6px 9px;border-radius:8px;border:1px solid var(--hair);background:var(--glass-2);outline:none}
.in:focus,textarea.in:focus{border-color:var(--accent)}
textarea.in{resize:vertical;line-height:1.55}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.row{display:flex;gap:6px;align-items:center;min-width:0}
.row>.grow{flex:1;min-width:0}
.list{display:grid;gap:4px;margin:0;padding:0;list-style:none}
.li{display:flex;gap:8px;align-items:center;padding:5px 8px;border-radius:8px;background:var(--glass-2);border:1px solid var(--hair);min-width:0}
.li .tx{flex:1;min-width:0;overflow-wrap:anywhere}
.li.done .tx{color:var(--faint);text-decoration:line-through}
.chk{width:16px;height:16px;accent-color:var(--accent);flex:none;cursor:pointer}
.seg{display:inline-flex;border:1px solid var(--hair);border-radius:8px;overflow:hidden;flex-wrap:wrap}
.seg button{border:0;background:transparent;padding:4px 9px;font-size:12px;cursor:pointer;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent);font-weight:500}
.empty{font-size:12px;color:var(--faint);padding:6px 2px}
.hint{font-size:11px;color:var(--faint)}
.bar{height:6px;border-radius:3px;background:var(--hair);overflow:hidden}
.bar b{display:block;height:100%;background:var(--accent);border-radius:3px;transition:width .5s}

/* clock */
.clock{display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:center}
.clock svg{width:112px;height:112px}
.clock .t{font-family:var(--f-num);font-size:38px;line-height:1;letter-spacing:-.02em}
.clock .t small{font-size:16px;color:var(--muted);margin-left:4px}
.clock .d{color:var(--muted);margin-top:6px}

/* calendar */
.cal-h{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.cal-h .ym{font-size:18px;font-weight:600}
.cal-wrap{overflow-x:auto}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border-top:1px solid var(--hair);border-left:1px solid var(--hair);min-width:560px}
.cal .wd{font-size:11px;color:var(--muted);text-align:center;padding:4px;border-right:1px solid var(--hair);border-bottom:1px solid var(--hair)}
.cal .wd.sun{color:var(--sun)} .cal .wd.sat{color:var(--sat)}
.cal .day{min-height:92px;padding:4px;border-right:1px solid var(--hair);border-bottom:1px solid var(--hair);cursor:pointer;display:flex;flex-direction:column;gap:2px;min-width:0;background:transparent;text-align:left;border-top:0;border-left:0}
.cal .day:hover{background:var(--glass-2)}
.cal .day.out{opacity:.45}
.cal .day.sel{background:var(--accent-soft)}
.cal .dn{font-size:12px;width:22px;height:22px;display:grid;place-items:center;border-radius:50%;align-self:center}
.cal .day.sun .dn{color:var(--sun)} .cal .day.sat .dn{color:var(--sat)}
.cal .day.today .dn{background:var(--accent);color:var(--bg);font-weight:600}
.ev{font-size:11px;line-height:1.3;padding:1px 5px;border-radius:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;background:var(--accent-soft);color:var(--fg);border-left:2px solid var(--accent)}
.ev.local{background:var(--warm-soft);border-left-color:var(--warm)}
.ev.more{background:transparent;border:0;color:var(--muted)}
.cal-foot{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;align-items:center;font-size:12px;color:var(--muted)}
.gstat{display:flex;gap:6px;align-items:center}
.gstat i{width:7px;height:7px;border-radius:50%;background:var(--faint)} .gstat.ok i{background:var(--ok)} .gstat.err i{background:var(--bad)}
.dayp{display:grid;gap:6px;padding:10px;border-radius:12px;background:var(--glass-2);border:1px solid var(--hair)}
.dayp a{color:var(--accent);font-size:12px}
.legend-dots{display:flex;gap:12px;font-size:11px;color:var(--muted)}
.legend-dots span::before{content:"";display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:4px;background:var(--accent);vertical-align:-1px}
.legend-dots span.l::before{background:var(--warm)}

/* dial */
.dial{display:grid;justify-items:center;gap:10px}
.dial svg{width:220px;height:220px;max-width:100%;touch-action:none;cursor:grab}
.dial .read{font-family:var(--f-num);font-size:30px}
.dial.ring .read{color:var(--bad)}
.dial svg text{font-family:var(--f-num);font-size:10px;fill:var(--muted)}

/* calc */
.calc{display:grid;gap:8px}
.calc .scr{text-align:right;padding:8px 10px;border-radius:10px;background:var(--glass-2);border:1px solid var(--hair);min-height:64px;overflow-wrap:anywhere}
.calc .scr .e{font-size:12px;color:var(--muted);min-height:18px}
.calc .scr .r{font-family:var(--f-num);font-size:26px}
.keys{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.keys button{padding:10px 0;border-radius:10px;border:1px solid var(--hair);background:var(--glass-2);cursor:pointer;font-family:var(--f-num);font-size:15px}
.keys button:hover{border-color:var(--accent)}
.keys .op{color:var(--accent)} .keys .eq{background:var(--accent-soft);color:var(--accent);border-color:var(--accent)}
.kv{display:grid;grid-template-columns:1fr auto;gap:4px 12px;font-size:13px}
.kv .num{text-align:right}
.kv .tot{font-weight:600;color:var(--accent);border-top:1px solid var(--hair);padding-top:4px}
.kv .tot.num{color:var(--accent)}
.hist{max-height:110px;overflow:auto}

/* planner */
.hours{display:grid;grid-template-columns:44px 1fr;gap:3px 8px;align-items:center}
.hours .hh{font-family:var(--f-num);font-size:11px;color:var(--muted);text-align:right}
.hours .in{padding:3px 8px;font-size:13px}

/* quote */
.quote{display:grid;gap:8px;padding:6px 2px}
.quote blockquote{margin:0;font-size:17px;line-height:1.6;text-wrap:balance;border-left:2px solid var(--warm);padding-left:12px}
.quote cite{font-style:normal;font-size:12px;color:var(--muted);padding-left:14px}

/* mindmap */
.mm-wrap{overflow:auto;border-radius:12px;background:var(--glass-2);border:1px solid var(--hair)}
.mm-wrap svg{display:block;min-width:520px;width:100%;height:auto}
.mm-node{cursor:pointer}
.mm-node rect{fill:var(--glass);stroke:var(--hair);stroke-width:1}
.mm-node.root rect{fill:var(--accent-soft);stroke:var(--accent)}
.mm-node.sel rect{stroke:var(--warm);stroke-width:2}
.mm-node text{fill:var(--fg);font-size:12px;font-family:var(--f-body)}
.mm-link{fill:none;stroke-width:1.5;opacity:.7}

/* mandalart */
.ma-wrap{overflow-x:auto}
.ma{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;min-width:540px}
.ma .blk{display:grid;grid-template-columns:repeat(3,1fr);gap:2px;padding:2px;border-radius:10px;background:var(--hair)}
.ma .blk.center{background:var(--accent-soft)}
.ma textarea{aspect-ratio:1;width:100%;resize:none;border:0;border-radius:6px;background:var(--glass);font-size:11px;line-height:1.3;padding:4px;text-align:center;outline:none;overflow:hidden}
.ma textarea.sub{background:var(--accent-soft);font-weight:500}
.ma textarea.main{background:var(--warm-soft);font-weight:600;font-size:12px}
.ma textarea:focus{box-shadow:inset 0 0 0 2px var(--accent)}

/* notes */
.notes{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:6px}
.note{position:relative;padding:8px 22px 8px 9px;border-radius:10px;font-size:13px;min-height:58px;overflow-wrap:anywhere;border:1px solid var(--hair)}
.note .x{position:absolute;top:2px;right:2px}
.tmemo-tabs{display:flex;gap:4px;flex-wrap:wrap;align-items:center}
.tmemo-tabs .tab{font-size:12px;padding:3px 10px}

/* counter */
.ctr{display:grid;grid-template-columns:1fr auto;gap:4px 10px;align-items:center;padding:8px 10px;border-radius:10px;background:var(--glass-2);border:1px solid var(--hair)}
.ctr .v{font-family:var(--f-num);font-size:26px;line-height:1}
.ctr .v small{font-size:13px;color:var(--muted)}
.ctr .bar{grid-column:1/-1}

/* custom text */
.ctext{padding:16px 6px;outline:none;border-radius:10px;overflow-wrap:anywhere;min-height:60px}
.ctext:focus{background:var(--glass-2)}
.ctext.quote{border-left:3px solid var(--warm);padding-left:14px}
.ctext.label{letter-spacing:.08em}

/* timeblock */
.tb{display:grid;grid-template-columns:40px 1fr 1fr;gap:2px 3px;align-items:stretch}
.tb .hh{font-family:var(--f-num);font-size:11px;color:var(--muted);text-align:right;padding-right:4px;line-height:26px}
.tb .slot{height:26px;border-radius:5px;background:var(--glass-2);border:1px solid var(--hair);cursor:pointer;font-size:11px;padding:0 6px;text-align:left;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;color:var(--fg)}
.tb-cats{display:flex;gap:4px;flex-wrap:wrap}
.tb-cats button{display:inline-flex;gap:5px;align-items:center}
.tb-cats i{width:9px;height:9px;border-radius:3px;display:inline-block}

/* eisenhower */
.eis{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.quad{border-radius:12px;padding:8px;display:grid;gap:6px;align-content:start;min-height:130px;border:1px solid var(--hair);background:var(--glass-2);min-width:0}
.quad h3{margin:0;font-size:12px;font-weight:600;display:flex;justify-content:space-between}
.quad h3 span{font-weight:400;color:var(--muted)}
.quad.drop{border-color:var(--accent);background:var(--accent-soft)}
.quad .li{cursor:grab;background:var(--glass)}

/* habit */
.hab-wrap{overflow-x:auto}
.hab{display:grid;gap:3px;align-items:center;min-width:0}
.hab .hn{font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-right:4px}
.hab .dh{font-family:var(--f-num);font-size:10px;color:var(--muted);text-align:center}
.hab .dh.today{color:var(--accent);font-weight:600}
.hab button.c{width:100%;aspect-ratio:1;border-radius:5px;border:1px solid var(--hair);background:var(--glass-2);cursor:pointer;padding:0;min-width:16px}
.hab .st{font-family:var(--f-num);font-size:11px;color:var(--warm);text-align:right;white-space:nowrap}

/* check-in */
.scale{display:flex;gap:4px;flex-wrap:wrap}
.scale button{flex:1;min-width:44px;padding:6px 0;border-radius:8px;border:1px solid var(--hair);background:var(--glass-2);cursor:pointer;font-size:12px}
.scale button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);color:var(--accent);font-weight:600}
.heat{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
.heat i{aspect-ratio:1;border-radius:4px;background:var(--hair);display:block}

/* life */
.lp{display:grid;gap:9px}
.lp .lb{display:flex;justify-content:space-between;font-size:12px;margin-bottom:3px;gap:8px}
.lp .lb .num{color:var(--muted)}

/* chart */
.chart svg{width:100%;height:auto;display:block}
.chart svg text{font-family:var(--f-body);fill:var(--muted);font-size:11px}
.chart svg text.v{font-family:var(--f-num);fill:var(--fg)}
.chart svg .grid-l{stroke:var(--hair)}
.ch-rows{display:grid;gap:4px;max-height:170px;overflow:auto}
.ch-rows .row .in{padding:3px 7px;font-size:12px}
.ch-rows .row input[type=number]{width:84px;flex:none}
.big-num{text-align:center;padding:18px 0}
.big-num .n{font-family:var(--f-num);font-size:48px;line-height:1}
.big-num .l{color:var(--muted);margin-top:6px}

footer{font-size:12px;color:var(--faint);text-align:center;line-height:1.7}

@media (max-width:720px){.card.wide{grid-column:auto}.clock{grid-template-columns:1fr;justify-items:center;text-align:center}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
<style>
/* 벤토 테마(대표님 레퍼런스 10/29): 흰 카드 + 피치·주황 포인트, 연초록·핑크 태그, 부드러운 크림 바탕 */
:root{
  --page:#FFFFFF; --bg:#FBF6F0; --glass:#FFFFFF; --glass-2:#FAF5EF; --glass-line:#F1E8DE; --hair:rgba(110,80,50,.11);
  --fg:#2F2A26; --muted:#7E746C; --faint:#ADA39A;
  --accent:#F2A03D; --accent-soft:#FDEBD4; --warm:#6DB57E; --warm-soft:#E2F2E5; --pink:#EE8A9A; --pink-soft:#FCE3E7;
  --ok:#6DB57E; --bad:#E2615F; --sun:#E2615F; --sat:#5D8FD0;
  --c1:#F2A03D; --c2:#6DB57E; --c3:#EE8A9A; --c4:#8E9CF0; --c5:#5DB7D0; --c6:#F2C14E; --c7:#B58EE0; --c8:#A9A29B;
  --shadow:0 1px 2px rgba(120,80,40,.05),0 8px 22px rgba(120,80,40,.06);
  --f-num:"Nunito","IBM Plex Sans KR",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --page:#191919; --bg:#1C1915; --glass:#26221E; --glass-2:#2F2A25; --glass-line:#3A332C; --hair:rgba(245,225,200,.12);
  --fg:#F5EFE8; --muted:#BDB2A7; --faint:#8E8378;
  --accent:#F5B15E; --accent-soft:rgba(245,177,94,.18); --warm:#8FCB9C; --warm-soft:rgba(143,203,156,.16); --pink:#F4A1AE; --pink-soft:rgba(244,161,174,.16);
  --ok:#8FCB9C; --bad:#F0827F; --sun:#F0827F; --sat:#8DB2E6;
  --c1:#F5B15E; --c2:#8FCB9C; --c3:#F4A1AE; --c4:#A7B2F5; --c5:#7FC8DC; --c6:#F5D07A; --c7:#C7A6EC; --c8:#B5AEA8;
  --shadow:0 1px 2px rgba(0,0,0,.25); color-scheme:dark}}
:root[data-theme="dark"]{
  --page:#191919; --bg:#1C1915; --glass:#26221E; --glass-2:#2F2A25; --glass-line:#3A332C; --hair:rgba(245,225,200,.12);
  --fg:#F5EFE8; --muted:#BDB2A7; --faint:#8E8378;
  --accent:#F5B15E; --accent-soft:rgba(245,177,94,.18); --warm:#8FCB9C; --warm-soft:rgba(143,203,156,.16); --pink:#F4A1AE; --pink-soft:rgba(244,161,174,.16);
  --ok:#8FCB9C; --bad:#F0827F; --sun:#F0827F; --sat:#8DB2E6;
  --c1:#F5B15E; --c2:#8FCB9C; --c3:#F4A1AE; --c4:#A7B2F5; --c5:#7FC8DC; --c6:#F5D07A; --c7:#C7A6EC; --c8:#B5AEA8;
  --shadow:0 1px 2px rgba(0,0,0,.25); color-scheme:dark}
body{background:linear-gradient(160deg,var(--bg) 0%,var(--glass-2) 60%,var(--accent-soft) 100%) fixed,var(--bg)}
.bg{display:none}
.card{border-radius:20px;backdrop-filter:none;-webkit-backdrop-filter:none;border-color:var(--glass-line);padding:16px 18px 18px}
.card-h h2{font-size:15px;font-weight:600}
.btn{border-radius:999px}
.btn.pri{background:var(--accent-soft);border-color:transparent;color:var(--fg);font-weight:600}
.btn.pri:hover{border-color:var(--accent);color:var(--fg)}
.in,textarea.in,select.in{border-radius:12px;background:var(--glass-2);border-color:transparent}
.in:focus,textarea.in:focus{border-color:var(--accent)}
.li{border-radius:12px;border-color:transparent}
.bar{height:6px;background:var(--glass-2)}
.bar b{background:var(--accent)}
.seg{border-radius:999px;border-color:transparent;background:var(--glass-2)}
.seg button{border-radius:999px}
.seg button[aria-pressed="true"]{background:var(--glass);color:var(--fg);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.tab[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--fg)}
.num{font-weight:700}
.clock .t,.dial .read,.ctr .v,.big-num .n,.calc .scr .r{font-weight:800}
.cal .day.today .dn{background:var(--accent);color:var(--fg)}
.ev{border-left-color:var(--accent);background:var(--accent-soft)}
.ev.local{border-left-color:var(--warm);background:var(--warm-soft)}
body.solo{background:var(--page)}
body.solo .wrap{padding-block:4px;max-width:none;padding-left:4px;padding-right:4px}
body.solo .card{box-shadow:none}

/* 포모도로·진행률 */
.focus{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:18px;align-items:center}
.pomo{background:var(--accent-soft);border-radius:18px;padding:18px 14px;display:grid;gap:10px;justify-items:center}
.pomo-t{font-family:var(--f-num);font-weight:800;font-size:clamp(44px,8vw,62px);line-height:1;font-variant-numeric:tabular-nums}
.icon-btn{width:34px;height:34px;border-radius:50%;border:1px solid var(--hair);background:var(--glass);cursor:pointer;display:grid;place-items:center;font-size:13px;color:var(--fg)}
.icon-btn:hover{border-color:var(--accent)}
.chips{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.chip{border:1px solid transparent;border-radius:999px;padding:4px 12px;font-size:12px;background:var(--glass);cursor:pointer;color:var(--muted)}
.chip.on{border-color:var(--accent);color:var(--fg);font-weight:600}
.chip.sage{background:var(--warm-soft)}
.pomo-dots{display:flex;gap:6px}
.pomo-dots i{width:8px;height:8px;border-radius:50%;background:var(--glass);border:1px solid var(--hair)}
.pomo-dots i.on{background:var(--accent);border-color:transparent}
.prog{display:grid;grid-template-columns:auto minmax(0,1fr);gap:16px;align-items:center}
.rring{position:relative;width:118px;height:118px;flex:none}
.rring svg{width:100%;height:100%;transform:rotate(-90deg)}
.rring .rv{position:absolute;inset:0;display:grid;place-content:center;text-align:center}
.rring .rv b{font-family:var(--f-num);font-weight:800;font-size:28px;line-height:1}
.rring .rv span{font-size:11px;color:var(--muted)}
.pbars{display:grid;gap:7px;font-size:12px}
.pbars .pr{display:grid;grid-template-columns:52px minmax(0,1fr) 38px;gap:8px;align-items:center}
.pbars .pr .num{text-align:right;color:var(--muted);font-weight:600}
@media (max-width:560px){.focus,.prog{grid-template-columns:1fr;justify-items:center}.pbars{width:100%}}

/* 습관 타일 */
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.tile{background:var(--glass-2);border-radius:16px;padding:12px;display:grid;gap:6px;justify-items:center;text-align:center}
.tile .tn{font-size:13px;font-weight:600}
.tile .ic{font-size:26px;line-height:1.1}
.tile .tv{font-family:var(--f-num);font-weight:800;font-size:18px}
.tile .tv small{font-size:12px;color:var(--muted);font-weight:600}
.tile .dots{display:flex;gap:5px}
.tile .dots i{width:8px;height:8px;border-radius:50%;border:1px solid var(--hair)}
.tile .dots i.on{background:var(--accent);border-color:transparent}
.tile.done{background:var(--warm-soft)}
.tile.done .dots i.on{background:var(--warm)}
.tile .row{justify-content:center}

/* 독서 링 */
.read-card{display:grid;grid-template-columns:auto minmax(0,1fr);gap:14px;align-items:center}
.read-card .bt{font-weight:600;overflow-wrap:anywhere}
.read-card .bn{font-family:var(--f-num);font-weight:800;font-size:22px}
</style>
</head>
<body>
<div class="bg" aria-hidden="true"><i></i><i></i><i></i></div>
<main class="wrap">
  <header>
    <div>
      <div class="eyebrow">노션에 붙여 쓰는 위젯</div>
      <h1>위젯 서랍</h1>
      <div class="sub">시계·캘린더·타이머와 생산성·목표 도구 22종 · 카드 오른쪽 위 「단독 보기」로 하나만 띄울 수 있습니다</div>
    </div>
    <div class="save-state" id="saveState"><i></i><span>이 브라우저에 자동 저장</span></div>
  </header>
  <div class="tabs-row"><div class="tabs" id="tabs" role="toolbar" aria-label="위젯 분류"></div></div>
  <a class="back" href="#" id="back">← 위젯 전체 보기</a>
  <div class="grid" id="grid"></div>
  <footer>입력한 내용은 지금 쓰는 브라우저에 자동 저장됩니다(서버로 보내지 않음). 다른 컴퓨터에서는 따로 저장됩니다.</footer>
</main>

<script>
/* ───────── 공통 도구 ───────── */
const $=s=>document.querySelector(s);
function h(t,a,...c){const e=document.createElement(t);
  for(const[k,v]of Object.entries(a||{})){if(v==null||v===false)continue;
    if(k==="class")e.className=v;else if(k==="style")e.style.cssText=v;
    else if(k.startsWith("on"))e.addEventListener(k.slice(2),v);
    else if(k==="value")e.value=v;else if(k==="checked")e.checked=!!v;
    else if(k==="text")e.textContent=v;else e.setAttribute(k,v===true?"":v);}
  for(const x of c.flat(9)){if(x==null||x===false)continue;e.append(x.nodeType?x:document.createTextNode(String(x)));}
  return e;}
const SVGNS="http://www.w3.org/2000/svg";
function s(t,a,...c){const e=document.createElementNS(SVGNS,t);for(const[k,v]of Object.entries(a||{})){if(v==null)continue;if(k.startsWith("on"))e.addEventListener(k.slice(2),v);else e.setAttribute(k,v);}for(const x of c.flat(9)){if(x==null)continue;e.append(x.nodeType?x:document.createTextNode(String(x)));}return e;}
const pad=n=>String(n).padStart(2,"0");
const ymd=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const today=()=>ymd(new Date());
const parseD=str=>{const[y,m,d]=str.split("-").map(Number);return new Date(y,m-1,d)};
const addD=(str,n)=>{const d=parseD(str);d.setDate(d.getDate()+n);return ymd(d)};
const WD="일월화수목금토";
const fmtMD=str=>{const d=parseD(str);return `${d.getMonth()+1}/${d.getDate()}(${WD[d.getDay()]})`};
const uid=()=>Math.random().toString(36).slice(2,9);
const won=n=>Math.round(n).toLocaleString("ko-KR");
const clone=o=>JSON.parse(JSON.stringify(o));
const PAL=["--c1","--c2","--c3","--c4","--c5","--c6","--c7","--c8"].map(v=>`var(${v})`);
const enterKey=fn=>e=>{if(e.key==="Enter"&&!e.isComposing){e.preventDefault();fn();}};

/* ───────── 저장: 이 브라우저(localStorage) + 클로드 계정(db, data/users/<id>) ───────── */
const ST={db:null,uid:null,timers:{}};
function lsGet(k){try{const v=localStorage.getItem(k);return v==null?null:JSON.parse(v)}catch{return null}}
function lsSet(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch{}}
function persist(key,state){
  const t=Date.now();lsSet("ws:"+key,state);lsSet("ws:t:"+key,t);
  if(ST.db&&ST.uid){clearTimeout(ST.timers[key]);
    ST.timers[key]=setTimeout(()=>{ST.db.doc(`data/users/${ST.uid}/w_${key}`).set({v:state,t}).catch(()=>{});},700);}
}

/* ───────── 위젯 등록 ───────── */
const W=[];
const CATS=[["all","전체"],["time","시간·일정"],["prod","생산성·도구"],["data","데이터·목표"]];
const CATNAME={time:"시간·일정",prod:"생산성·도구",data:"데이터·목표"};
function widget(d){W.push(d)}
function mountAll(){
  const grid=$("#grid");grid.replaceChildren();
  for(const w of W){
    const stored=lsGet("ws:"+w.key);
    w.s=stored||w.def();
    const body=h("div",{class:"body"});
    w.card=h("section",{class:"card"+(w.wide?" wide":""),id:"w-"+w.key,"data-cats":w.cats.join(" ")},
      h("div",{class:"card-h"},h("h2",null,w.title,h("span",{class:"cat"},CATNAME[w.cats[0]])),
        h("a",{class:"solo-link",href:"#w-"+w.key,title:"이 위젯만 크게 보기"},"단독 보기")),body);
    body.append=(...x)=>Element.prototype.append.apply(body,x.flat(9).filter(v=>v!=null&&v!==false));
    w.body=body;grid.append(w.card);render(w);
  }
}
function render(w){
  try{w.cleanup?.()}catch{}
  w.body.replaceChildren();
  const ctx={s:w.s,save:()=>persist(w.key,w.s),rerender:()=>render(w),key:w.key};
  w.cleanup=w.mount(w.body,ctx)||null;
}

/* ═════════ 시간·일정 ═════════ */

widget({key:"clock",title:"시계",cats:["time"],def:()=>({h24:true}),mount(el,c){
  const face=s("svg",{viewBox:"0 0 100 100","aria-hidden":"true"});
  face.append(s("circle",{cx:50,cy:50,r:46,fill:"var(--glass-2)",stroke:"var(--hair)","stroke-width":1.5}));
  for(let i=0;i<12;i++){const a=i*30*Math.PI/180,r1=i%3?40:37;face.append(s("line",{x1:50+r1*Math.sin(a),y1:50-r1*Math.cos(a),x2:50+43*Math.sin(a),y2:50-43*Math.cos(a),stroke:"var(--muted)","stroke-width":i%3?1:2,"stroke-linecap":"round"}));}
  const hh=s("line",{x1:50,y1:50,stroke:"var(--fg)","stroke-width":3.2,"stroke-linecap":"round"}),
        mm=s("line",{x1:50,y1:50,stroke:"var(--fg)","stroke-width":2,"stroke-linecap":"round"}),
        ss=s("line",{x1:50,y1:54,stroke:"var(--warm)","stroke-width":1,"stroke-linecap":"round"});
  face.append(hh,mm,ss,s("circle",{cx:50,cy:50,r:2.4,fill:"var(--warm)"}));
  const tEl=h("div",{class:"t"}),dEl=h("div",{class:"d"});
  const toggle=h("div",{class:"seg"},
    h("button",{"aria-pressed":String(c.s.h24),onclick:()=>{c.s.h24=true;c.save();c.rerender()}},"24시간"),
    h("button",{"aria-pressed":String(!c.s.h24),onclick:()=>{c.s.h24=false;c.save();c.rerender()}},"12시간"));
  el.append(h("div",{class:"clock"},face,h("div",null,tEl,dEl)),h("div",{class:"row"},toggle));
  const set=(l,a,len)=>{l.setAttribute("x2",50+len*Math.sin(a));l.setAttribute("y2",50-len*Math.cos(a))};
  function tick(){const n=new Date(),H=n.getHours(),M=n.getMinutes(),S=n.getSeconds();
    set(hh,((H%12)+M/60)*Math.PI/6,24);set(mm,(M+S/60)*Math.PI/30,34);set(ss,S*Math.PI/30,38);
    const showH=c.s.h24?pad(H):((H%12)||12);
    tEl.replaceChildren(`${showH}:${pad(M)}`,h("small",null,c.s.h24?pad(S):(H<12?"오전":"오후")));
    dEl.textContent=`${n.getFullYear()}년 ${n.getMonth()+1}월 ${n.getDate()}일 ${WD[n.getDay()]}요일`;}
  tick();const iv=setInterval(tick,1000);return()=>clearInterval(iv);
}});

/* 구글 캘린더 연결 상태 (페이지 전체에서 하나) */
const GC_SERVER="Google Calendar";
const G={mcp:null,ready:false,key:null,un:null,events:[],status:"wait",msg:"구글 캘린더 연결 확인 중",at:null,needBtn:false,input:null};
function parseGEvent(e){
  const st=e.start||{},en=e.end||{};
  if(st.date){const sd=String(st.date).slice(0,10);let ed=String(en.date||st.date).slice(0,10);ed=ed>sd?addD(ed,-1):sd;
    return {t:e.summary||"(제목 없음)",sd,ed,time:"",link:e.htmlLink||"",desc:e.description||""};}
  if(st.dateTime){const a=new Date(st.dateTime),b=new Date(en.dateTime||st.dateTime);
    return {t:e.summary||"(제목 없음)",sd:ymd(a),ed:ymd(b),time:`${pad(a.getHours())}:${pad(a.getMinutes())}`,link:e.htmlLink||"",desc:e.description||""};}
  return null;
}
function gHandle(res){
  const p=res&&res.payload;const list=(p&&Array.isArray(p.events))?p.events:[];
  G.events=list.map(parseGEvent).filter(Boolean);G.status="ok";G.needBtn=false;
  G.at=res.cache?.storedAt||Date.now();
  const d=new Date(G.at);G.msg=`구글 캘린더 연결됨 · ${pad(d.getHours())}:${pad(d.getMinutes())} 기준`;
}
function gError(err){
  const code=err&&err.code;
  const retract=()=>{G.events=[]};
  G.status="err";G.needBtn=false;
  switch(code){
    case "approval_required":G.msg="구글 캘린더를 불러오려면 한 번 허용이 필요합니다";G.needBtn=true;G.status="wait";break;
    case "needs_reauth":retract();G.msg="구글 캘린더 연결이 만료됐습니다. claude.ai 설정 → 커넥터에서 다시 연결해 주세요";break;
    case "server_not_connected":case "selection_required":case "server_not_found":retract();G.msg="claude.ai 설정 → 커넥터에서 Google Calendar를 추가해 주세요";break;
    case "not_in_manifest":case "blocked_by_policy":retract();G.msg="이 페이지에서 구글 캘린더 사용이 꺼져 있습니다(권한 메뉴에서 켤 수 있음)";break;
    case "not_granted":case "capability_disabled":case "capability_removed":retract();G.msg="이 화면에서는 구글 캘린더를 불러올 수 없습니다";break;
    case "server_unavailable":case "upstream_error":case "rate_limited":G.msg="구글 캘린더 응답이 늦습니다. 마지막으로 받은 일정을 보여 줍니다";break;
    default:G.msg="구글 캘린더를 불러오지 못했습니다"+(err&&err.message?` (${String(err.message).slice(0,60)})`:"");
  }
}
function gWatchMonth(y,m,onChange){
  if(!G.mcp)return;
  const key=`${y}-${m}`;if(G.key===key&&G.un)return;
  try{G.un?.()}catch{}
  const ny=m===11?y+1:y,nm=m===11?0:m+1;
  G.key=key;G.input={startTime:`${y}-${pad(m+1)}-01T00:00:00`,endTime:`${ny}-${pad(nm+1)}-01T00:00:00`,pageSize:250,orderBy:"startTime"};
  G.un=G.mcp.watchTool(GC_SERVER,"list_events",G.input,ev=>{
    if(ev.type==="data")gHandle(ev.result);else gError(ev.error);onChange();
  },{cache:{staleTime:300000,gcTime:86400000},refetchInterval:600000});
}
async function gLoadOnce(onChange){
  if(!G.mcp||!G.input)return;G.msg="구글 캘린더 불러오는 중…";onChange();
  try{gHandle(await G.mcp.callTool(GC_SERVER,"list_events",G.input));}catch(e){gError(e)}onChange();
}

widget({key:"calendar",title:"캘린더",cats:["time"],wide:true,def:()=>({events:[]}),mount(el,c){
  const now=new Date();let view=c.view||(c.view={y:now.getFullYear(),m:now.getMonth(),sel:today()});
  const W_=this;
  function draw(){
    el.replaceChildren();
    const {y,m}=view;
    const first=new Date(y,m,1),start=new Date(y,m,1-first.getDay());
    const weeks=Math.ceil((first.getDay()+new Date(y,m+1,0).getDate())/7);
    const evOn=d=>{
      const g=G.events.filter(e=>e.sd<=d&&e.ed>=d).map(e=>({...e,src:"g"}));
      const l=c.s.events.filter(e=>e.d===d).map(e=>({t:e.t,time:e.time||"",src:"l",id:e.id}));
      return [...g,...l].sort((a,b)=>(a.time||"").localeCompare(b.time||""));};
    const head=h("div",{class:"cal-h"},
      h("div",{class:"row"},h("span",{class:"ym"},`${y}년 ${m+1}월`)),
      h("div",{class:"row"},
        h("button",{class:"btn",onclick:()=>{view.m--;if(view.m<0){view.m=11;view.y--}go()},"aria-label":"이전 달"},"‹"),
        h("button",{class:"btn",onclick:()=>{const n=new Date();view.y=n.getFullYear();view.m=n.getMonth();view.sel=today();go()}},"오늘"),
        h("button",{class:"btn",onclick:()=>{view.m++;if(view.m>11){view.m=0;view.y++}go()},"aria-label":"다음 달"},"›")));
    const cal=h("div",{class:"cal"});
    for(let i=0;i<7;i++)cal.append(h("div",{class:"wd"+(i===0?" sun":i===6?" sat":"")},WD[i]));
    const td=today();
    for(let i=0;i<weeks*7;i++){
      const d=new Date(start);d.setDate(start.getDate()+i);const ds=ymd(d);const evs=evOn(ds);
      const cell=h("button",{type:"button",class:["day",d.getMonth()!==m&&"out",d.getDay()===0&&"sun",d.getDay()===6&&"sat",ds===td&&"today",ds===view.sel&&"sel"].filter(Boolean).join(" "),
        onclick:()=>{view.sel=ds;draw()},"aria-label":`${d.getMonth()+1}월 ${d.getDate()}일, 일정 ${evs.length}개`},
        h("span",{class:"dn"},d.getDate()),
        evs.slice(0,3).map(e=>h("span",{class:"ev"+(e.src==="l"?" local":""),title:e.t},(e.time?e.time+" ":"")+e.t)),
        evs.length>3?h("span",{class:"ev more"},`+${evs.length-3}개`):null);
      cal.append(cell);
    }
    const sel=view.sel,list=evOn(sel);
    const inp=h("input",{class:"in grow",id:"cal-add",placeholder:`${fmtMD(sel)} 일정 추가 (이 서랍에만 저장)`});
    const tim=h("input",{class:"in",id:"cal-time",type:"time",style:"width:110px;flex:none"});
    const add=()=>{const t=inp.value.trim();if(!t)return;c.s.events.push({id:uid(),d:sel,t,time:tim.value||""});c.save();draw();$("#cal-add")?.focus()};

/* 계산식 해석기 (eval 없이) */
function calcExpr(src){
  const str=String(src).replace(/[×xX]/g,"*").replace(/÷/g,"/").replace(/,/g,"").replace(/\s+/g,"");
  let i=0;const peek=()=>str[i];
  function expr(){let v=term();while(peek()==="+"||peek()==="-"){const o=str[i++],r=term();v=o==="+"?v+r:v-r}return v}
  function term(){let v=power();while(peek()==="*"||peek()==="/"){const o=str[i++],r=power();v=o==="*"?v*r:v/r}return v}
  function power(){const b=unary();if(peek()==="^"){i++;return Math.pow(b,power())}return b}
  function unary(){if(peek()==="-"){i++;return -unary()}if(peek()==="+"){i++;return unary()}return post(atom())}
  function post(v){while(peek()==="%"){i++;v=v/100}return v}
  function atom(){if(peek()==="("){i++;const v=expr();if(peek()!==")")throw new Error("괄호");i++;return v}
    const m=/^(\d+\.?\d*|\.\d+)(e[+-]?\d+)?/i.exec(str.slice(i));if(!m)throw new Error("수식");i+=m[0].length;return parseFloat(m[0])}
  if(!str)return null;const v=expr();if(i<str.length)throw new Error("수식");return v;
}
const fmtNum=v=>{if(v==null||!isFinite(v))return "—";const r=Math.round(v*1e10)/1e10;return Math.abs(r)>=1e15?r.toExponential(6):r.toLocaleString("ko-KR",{maximumFractionDigits:10})};

widget({key:"reading",title:"독서",cats:["data"],def:()=>({}),mount(el,c){
  const bw=W.find(w=>w.key==="books");const list=bw.s.books;const b=list.find(x=>x.p&&x.r<x.p)||list[0];
  const saveBooks=()=>{persist("books",bw.s);render(bw);c.rerender()};
  if(!b){const t=h("input",{class:"in grow",id:"rd-t",placeholder:"읽는 책 제목"}),p=h("input",{class:"in",id:"rd-p",type:"number",min:1,placeholder:"쪽수",style:"width:76px;flex:none"});
    el.append(h("div",{class:"read-card"},h("div",{class:"rring"},ringSVG(0),h("div",{class:"rv"},h("b",null,"0"),h("span",null,"%"))),h("div",{class:"sub"},"읽고 있는 책을 넣으면 진도가 링으로 보입니다")),
      h("div",{class:"row"},t,p,h("button",{class:"btn pri",onclick:()=>{if(!t.value.trim())return;list.unshift({id:uid(),t:t.value.trim(),p:+p.value||0,r:0});saveBooks()}},"추가")));return}
  const pct=b.p?b.r/b.p:0;const step=d=>{b.r=Math.max(0,Math.min(b.p||1e9,b.r+d));saveBooks()};
  el.append(h("div",{class:"read-card"},h("div",{class:"rring"},ringSVG(pct,"var(--pink)"),h("div",{class:"rv"},h("b",null,Math.round(pct*100)),h("span",null,"%"))),
    h("div",{style:"display:grid;gap:4px;min-width:0"},h("div",{class:"bt"},b.t),h("div",{class:"bn"},`${b.r}`,h("small",{class:"sub"},` / ${b.p||"?"}쪽`)),
      h("div",{class:"row"},h("button",{class:"btn",onclick:()=>step(1)},"+1쪽"),h("button",{class:"btn pri",onclick:()=>step(10)},"+10쪽"),h("button",{class:"btn ghost","aria-label":"1쪽 빼기",onclick:()=>step(-1)},"−1")))),
    h("div",{class:"hint"},"북 트래커와 같은 기록을 씁니다"));
}});

/* ───────── 탭·단독 보기 ───────── */
let CAT=lsGet("ws:cat")||"all";
function drawTabs(){$("#tabs").replaceChildren(...CATS.map(([k,n])=>{const cnt=k==="all"?W.length:W.filter(w=>w.cats.includes(k)).length;
  return h("button",{class:"tab","aria-pressed":String(CAT===k),onclick:()=>{CAT=k;lsSet("ws:cat",k);drawTabs();applyView()}},`${n} ${cnt}`)}))}
function applyView(){const m=/^#w-([a-z]+)$/.exec(location.hash);const solo=m&&W.find(w=>w.key===m[1]);
  if(m&&!solo){document.body.classList.add("solo");for(const w of W)w.card.hidden=true;return}
  document.body.classList.toggle("solo",!!solo);
  for(const w of W)w.card.hidden=solo?w!==solo:!(CAT==="all"||w.cats.includes(CAT));
  if(solo)window.scrollTo(0,0);}
$("#back").addEventListener("click",e=>{e.preventDefault();history.replaceState(null,"",location.pathname+location.search);applyView()});
window.addEventListener("hashchange",applyView);
mountAll();drawTabs();applyView();

G.status="";G.msg="여기 추가한 일정은 이 브라우저에만 저장됩니다";W.find(w=>w.key==="calendar")?.redraw?.();
